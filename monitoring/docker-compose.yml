# Prometheus scrapes vLLM's /metrics on Modal; Grafana charts it at http://localhost:3000
# Only run this during a benchmark: every scrape is a request that keeps the GPU awake.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]  # GRAFANA_PORT=3001 if 3000 is taken
    depends_on: [prometheus]
